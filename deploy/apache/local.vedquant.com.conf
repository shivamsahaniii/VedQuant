# Vedquant local development site: http://local.vedquant.com
#
# Apache is only a reverse proxy here (Vedquant is Python + Vue, not PHP):
#   /api/...  -> FastAPI in Docker      (127.0.0.1:8000, "/api" prefix removed)
#   /...      -> Vite dev server (Vue)  (127.0.0.1:5173, incl. hot-reload WebSocket)
#
# Needs this line in /etc/hosts:  127.0.0.1  local.vedquant.com
# Needs: a2enmod proxy proxy_http   (WebSockets use mod_proxy_http's upgrade=, Apache >= 2.4.47)
# Install: see deploy/apache/README.md

<VirtualHost *:80>
    ServerName local.vedquant.com
    ServerAdmin webmaster@localhost

    ProxyRequests Off
    ProxyPreserveHost On
    ProxyTimeout 60

    # Tell the backends the original host/scheme.
    RequestHeader set X-Forwarded-Proto "http"

    # API (FastAPI). Live-price WebSockets (/api/ws/...) are upgraded too.
    ProxyPass        /api/ http://127.0.0.1:8000/ upgrade=websocket
    ProxyPassReverse /api/ http://127.0.0.1:8000/

    # Frontend (Vite dev server, with hot-reload WebSocket).
    ProxyPass        /     http://127.0.0.1:5173/ upgrade=websocket
    ProxyPassReverse /     http://127.0.0.1:5173/

    ErrorLog  ${APACHE_LOG_DIR}/vedquant-error.log
    CustomLog ${APACHE_LOG_DIR}/vedquant-access.log combined
</VirtualHost>
